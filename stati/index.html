<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Статьи психолога</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="description" content="Все статьи в одном месте: об отношениях, любви, норме и личных границах. Многие можно не только читать, но и слушать.">
<meta property="og:title" content="Статьи психолога">
<meta property="og:description" content="Все статьи в одном месте: об отношениях, любви, норме и личных границах.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,400;1,500&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efe4d0; --bg2:#e4d5bb; --ink:#2b2119; --ink2:#5a4a3c; --muted:#8a7764; --line:#d6c4a6;
  --row:#f8f1e4; --row2:#fffaf1; --accent:#b4532e; --mapline:#c9b597;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#1f1914; --bg2:#16110d; --ink:#f1e6d4; --ink2:#cdbca5; --muted:#a08c76; --line:#3d3127; --row:#2a221b; --row2:#332920; --mapline:#4a3b2d; }
}
:root[data-theme="dark"]{ --bg:#1f1914; --bg2:#16110d; --ink:#f1e6d4; --ink2:#cdbca5; --muted:#a08c76; --line:#3d3127; --row:#2a221b; --row2:#332920; --mapline:#4a3b2d; }
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100svh; color:var(--ink); background:var(--bg);
  font:400 16px/1.5 "Golos Text",system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden}
body.locked{overflow:hidden}
/* карта на столе: горизонтали, медленно дышит */
.map{position:fixed; inset:-10%; z-index:0; pointer-events:none; opacity:.55;
  background:radial-gradient(ellipse at 30% 20%, transparent 0 40%, var(--bg2) 100%)}
.map svg{position:absolute; inset:0; width:100%; height:100%; animation:drift 40s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(-2%,1.5%) rotate(.6deg)}}
main{position:relative; z-index:1; max-width:760px; margin:0 auto; padding:calc(10px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}

header{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:0 0 10px}
h1{font:600 26px/1.1 Lora,Georgia,serif; margin:0}
.home{display:inline-flex; align-items:center; min-height:40px; padding:0 2px; color:var(--ink2); font-size:14px; text-decoration:none; border-bottom:1px solid var(--line)}
.home:hover{color:var(--accent)}
.home:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ---------- список ---------- */
.list{display:grid; gap:6px; margin:0; padding:0; list-style:none}
@media (min-width:700px){ .list{grid-template-columns:1fr 1fr; gap:10px} }
.item{width:100%; display:flex; align-items:center; gap:12px; min-height:58px; padding:5px 12px 5px 5px; border-radius:12px; text-align:left;
  border:1px solid var(--line); background:color-mix(in srgb, var(--row) 88%, transparent); color:var(--ink); cursor:pointer; font:inherit;
  transition:background .2s, transform .15s, border-color .2s; -webkit-tap-highlight-color:transparent}
.item:hover{background:var(--row2); border-color:var(--c)}
.item:active{transform:scale(.985)}
.item:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.item img{width:48px; height:48px; border-radius:8px; object-fit:cover; flex:none; background:#d9cbb4}
.txt{flex:1; min-width:0; display:flex; flex-direction:column; gap:1px}
.topic{font:600 10.5px/1.3 "Golos Text",sans-serif; letter-spacing:.09em; text-transform:uppercase; color:var(--c)}
:root[data-theme="dark"] .topic{filter:brightness(1.7) saturate(.8)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .topic{filter:brightness(1.7) saturate(.8)} }
.name{font:600 16px/1.2 Lora,Georgia,serif}
.topic .mins{font-weight:500; letter-spacing:.02em; text-transform:none; color:var(--muted)}
.meta{flex:none; font-size:12.5px; color:var(--muted); white-space:nowrap}
.item.soon img{filter:blur(2px) saturate(.5)}
.item.soon .name{color:var(--ink2)}
.end{margin:16px 0 0; text-align:center; color:var(--muted); font-size:14px}

/* ---------- шторка ---------- */
.veil{position:fixed; inset:0; z-index:40; background:rgba(25,16,8,.45); opacity:0; pointer-events:none; transition:opacity .35s}
.veil.on{opacity:1; pointer-events:auto}
.sheet{position:fixed; left:0; right:0; bottom:0; z-index:50; margin:0 auto; max-width:560px; max-height:94svh; overflow-y:auto; overscroll-behavior:contain;
  background:var(--bg); border-radius:20px 20px 0 0; box-shadow:0 -10px 40px -10px rgba(20,10,0,.5);
  padding:0 14px calc(16px + env(safe-area-inset-bottom)); transform:translateY(105%); transition:transform .45s cubic-bezier(.25,1,.35,1); visibility:hidden}
.sheet.on{transform:translateY(var(--dy,0px)); visibility:visible}
.sheet.drag{transition:none}
.grab{position:sticky; top:0; z-index:3; display:flex; align-items:center; justify-content:center; height:34px; margin:0 -14px; background:var(--bg); cursor:grab; touch-action:none}
.grab::before{content:""; width:42px; height:5px; border-radius:9px; background:var(--line)}
.close{position:absolute; right:8px; top:2px; width:40px; height:30px; border:0; background:none; color:var(--muted); font:400 24px/1 "Golos Text",sans-serif; cursor:pointer}
.close:focus-visible{outline:2px solid var(--accent)}
@media (min-width:700px){ .sheet{bottom:auto; top:50%; border-radius:20px; transform:translateY(-40%) scale(.96); opacity:0; transition:transform .4s cubic-bezier(.25,1,.35,1), opacity .3s}
  .sheet.on{transform:translateY(-50%); opacity:1} .grab{cursor:default} .grab::before{display:none} }

/* ---------- открытка ---------- */
.tiltbox{perspective:1100px; padding:2px 0 4px}
.card{position:relative; border-radius:10px; background:#fbf6ec; color:#2b2119; padding:10px; will-change:transform;
  box-shadow:0 1px 0 #fff8 inset, 0 18px 40px -18px rgba(40,25,10,.55), 0 2px 6px rgba(40,25,10,.18)}
.pic{position:relative; border-radius:6px; overflow:hidden; aspect-ratio:3/2; background:#d9cbb4; perspective:700px}
.pic img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scale(1.2) translate(var(--px,0px),var(--py,0px)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)); will-change:transform}
.sheen{position:absolute; inset:0; pointer-events:none; mix-blend-mode:soft-light;
  background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,.55) var(--gx,45%), transparent calc(var(--gx,45%) + 18%))}
.body{padding:14px 6px 4px}
.ctopic{font:600 11.5px/1.2 "Golos Text",sans-serif; letter-spacing:.09em; text-transform:uppercase; color:var(--c)}
.title{font:600 clamp(23px,6.4vw,28px)/1.15 Lora,Georgia,serif; margin:4px 0 8px}
.sub{font:italic 400 16px/1.45 Lora,Georgia,serif; color:#4a3b30; margin:0 0 12px}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 14px; padding:0; list-style:none}
.chips li{font-size:13px; padding:3px 10px; border-radius:99px; background:#ece0cb; color:#4d3d30}
.go{display:flex; align-items:center; justify-content:center; gap:8px; min-height:52px; border-radius:10px; text-decoration:none;
  background:var(--c,#2b2119); color:#fff8ec; font:600 16px/1 "Golos Text",sans-serif; box-shadow:inset 0 1px 0 #fff3, 0 6px 14px -8px #000a; transition:transform .15s}
.go:active{transform:scale(.98)}
.extra{display:flex; flex-wrap:wrap; justify-content:center; gap:4px 18px; margin:12px 0 2px}
.extra a{color:#a2482a; font-weight:500; text-underline-offset:3px}
.go:focus-visible,.extra a:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.soon .pic img{filter:blur(6px) saturate(.6) brightness(.9)}
.soon .go{background:#a79580; pointer-events:none}
.seal{position:absolute; left:50%; top:50%; width:84px; height:84px; margin:-42px; border-radius:50%; z-index:3;
  background:radial-gradient(circle at 35% 30%, #d0574b, #8f2219 70%); box-shadow:0 4px 10px #0006, inset 0 -3px 6px #0005, inset 0 3px 4px #fff3;
  display:flex; align-items:center; justify-content:center; color:#f6d9c8; font:italic 600 15px/1 Lora,serif; transform:rotate(-8deg)}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){ .sheet,.veil{transition:none} .map svg{animation:none} }
</style>
</head>

<main>
  <header>
    <h1>Статьи</h1>
    <a class="home" href="../" target="_top">← На главную</a>
  </header>
  <ul class="list" id="list"></ul>

<div class="veil" id="veil"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="stitle">
  <div class="grab" id="grab"><button type="button" class="close" id="close" aria-label="Закрыть">×</button></div>
  <div class="tiltbox"><div class="card" id="card"></div></div>
</section>

<script>
/* ======================================================================
   СПИСОК СТАТЕЙ. Новая статья = новый блок { ... } в начале списка.
   Картинка 3:2 кладётся в папку art/.
   short — тема статьи (1–3 слова), title — название.
   status: "open" — можно читать, "soon" — скоро (запечатана сургучом).
   ====================================================================== */
const ARTICLES = [
  { id:"rasstavanie", status:"open",
    short:"Расставание", title:"Точка рождения",
    sub:"Почему мы привыкли оплакивать конец отношений как личный крах — и как увидеть в разрыве не поражение, а акт сострадания и точку рождения.",
    url:"https://legendpsy.github.io/relations-essay/rasstavanie/", img:"art/rasstavanie.jpg",
    chips:["≈ 5 минут","живой сайт"], color:"#b0582c", mark:"Закат" },
  { id:"razdelyaya", status:"open",
    short:"Чувства и поступки", title:"Разделяя, создавай",
    sub:"Почему привычка оправдывать поступки эмоциями лишает нас авторства — и как один короткий зазор между импульсом и действием меняет всё, от самоуважения до любви.",
    url:"https://legendpsy.github.io/relations-essay/razdelyaya/", img:"art/razdelyaya.jpg",
    chips:["≈ 8 минут","живой сайт"], color:"#8a2f2c", mark:"Театр" },
  { id:"samoocenka", status:"open",
    short:"Самооценка", title:"Перестаньте «поднимать» самооценку",
    sub:"Почему попытка доказать собственную ценность превращает жизнь в вечный аукцион — и как навести порядок в одном слове, чтобы вернуть себе право ошибаться.",
    url:"https://legendpsy.github.io/relations-essay/samoocenka/", img:"art/samoocenka.jpg",
    chips:["≈ 7 минут","живой сайт"], color:"#2c7f80", mark:"Лето" },
  { id:"doverie", status:"open",
    short:"Доверие", title:"Разрешить другому не справиться",
    sub:"Почему страх перед близостью почти никогда не связан с тем, кто сидит напротив, — и что меняется в ту ночь, когда ты наконец разрешаешь другому не справиться.",
    url:"https://legendpsy.github.io/relations-essay/doverie/", img:"art/doverie.jpg",
    chips:["≈ 4 минуты","живой сайт"], color:"#3f6f8a", mark:"Море" },
  { id:"partner", status:"open",
    short:"Выбор партнёра", title:"На что можно смотреть бесконечно",
    sub:"Почему список качеств «идеального партнёра» рассыпается в первый же плохой вторник — и как вместо человека, который даёт нам нужное, выбрать того, чья суть вызывает восхищение.",
    url:"https://legendpsy.github.io/relations-essay/partner/", img:"art/partner.jpg",
    chips:["≈ 6 минут","живой сайт"], color:"#a8462a", mark:"Костёр" },
  { id:"granicy", status:"open",
    short:"Границы", title:"Чьи это границы?",
    sub:"Почему разговор о личных границах незаметно превратил их в свод правил для окружающих и вернул нам беспомощность, от которой мы пытались сбежать.",
    url:"https://legendpsy.github.io/relations-essay/granicy/", img:"art/granicy.jpg",
    chips:["≈ 14 минут","живой сайт"], color:"#3d5a3a", mark:"Сад" },
  { id:"kak-dolzhno", status:"open",
    short:"Ожидания", title:"Как вообще-то должно быть",
    sub:"Где проходит наша внутренняя отметка «нормы» — и почему мы разучились чувствовать хорошее, пока оно не превышает ожидания.",
    url:"https://legendpsy.github.io/relations-essay/kak-dolzhno/", img:"art/kak-dolzhno.jpg",
    chips:["≈ 12 минут"], color:"#a5563a", mark:"Город" },
  { id:"gorizont", status:"open",
    short:"Отношения", title:"Горизонт отношений",
    sub:"Статья в четырёх частях. Её можно читать, слушать в авторской озвучке и смотреть мультик одновременно.",
    url:"https://legendpsy.github.io/relations-essay/gorizont/", img:"art/gorizont.jpg",
    chips:["4 части","≈ 1 час","авторская озвучка","мультик"], color:"#5d7a4c", mark:"Дорога",
    extra:[["Вся статья целиком","https://legendpsy.github.io/relations-essay/gorizont/celikom.html"]] },
  { id:"love", status:"open",
    short:"Любовь", title:"Любовь не измеряется страданием",
    sub:"Почему мы принимаем тревогу, ревность и неспособность жить без другого за доказательство глубины чувств — и в поисках надёжности выбираем то, что делает близость невыносимой.",
    url:"https://legendpsy.github.io/love-essay/", img:"art/love.jpg",
    chips:["≈ 7 минут","живой сайт"], color:"#6b2a36", mark:"Скала" }
];
</script>
<script>
(() => {
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const list = $('list'), sheet = $('sheet'), veil = $('veil'), card = $('card'), grab = $('grab');

/* ---------- список ---------- */
list.innerHTML = ARTICLES.map(a => {
  const minutes = (a.chips || []).find(c => /мин|час/.test(c)) || '';
  const t = a.short && a.short !== a.title ? esc(a.short) : '';
  const m = a.status === 'soon' ? 'скоро' : esc(minutes);
  const topic = `<span class="topic">${t}${t && m ? ' · ' : ''}<span class="mins">${m}</span></span>`;
  return `<li><button type="button" class="item${a.status === 'soon' ? ' soon' : ''}" data-id="${a.id}" style="--c:${a.color}">
    <img src="${a.img}" alt="" loading="lazy" decoding="async">
    <span class="txt">${topic}<span class="name">${esc(a.title)}</span></span></button></li>`;
}).join('');

/* ---------- шторка ---------- */
let openId = null, lastBtn = null;
function fill(a){
  const soon = a.status === 'soon';
  card.className = 'card' + (soon ? ' soon' : '');
  card.style.setProperty('--c', a.color);
  card.innerHTML = `
    <div class="pic"><img src="${a.img}" alt="">${soon ? '<div class="seal">скоро</div>' : ''}<div class="sheen"></div></div>
    <div class="body">
      ${a.short && a.short !== a.title ? `<div class="ctopic">${esc(a.short)}</div>` : ''}
      <h2 class="title" id="stitle">${esc(a.title)}</h2>
      <p class="sub">${esc(a.sub)}</p>
      <ul class="chips">${(a.chips || []).map(c => `<li>${esc(c)}</li>`).join('')}</ul>
      ${soon ? `<span class="go" aria-disabled="true">Скоро здесь</span>`
             : `<a class="go" href="${a.url}" target="_top">Читать →</a>`}
      ${(a.extra || []).length ? `<div class="extra">${a.extra.map(([t,u]) => `<a href="${u}" target="_top">${esc(t)}</a>`).join('')}</div>` : ''}
    </div>`;
}
function open(id, fromBtn, push = true){
  const a = ARTICLES.find(x => x.id === id); if (!a) return;
  fill(a); openId = id; lastBtn = fromBtn || lastBtn;
  sheet.scrollTop = 0; sheet.style.removeProperty('--dy');
  sheet.classList.add('on'); veil.classList.add('on'); document.body.classList.add('locked');
  if (push) try { history.pushState({sheet:id}, '', '#' + id); } catch(e){}
  setTimeout(() => { const g = card.querySelector('.go'); g && g.focus({preventScroll:true}); }, 60);
  resetTilt();
}
function close(fromPop){
  if (!openId) return;
  openId = null;
  sheet.classList.remove('on', 'drag'); veil.classList.remove('on'); document.body.classList.remove('locked');
  sheet.style.removeProperty('--dy');
  if (!fromPop) { if (history.state && history.state.sheet) history.back(); else try { history.replaceState(null, '', location.pathname + location.search); } catch(e){} }
  lastBtn && lastBtn.focus({preventScroll:true});
}
list.addEventListener('click', e => {
  const b = e.target.closest('.item'); if (!b) return;
  askMotion();
  open(b.dataset.id, b);
});
veil.addEventListener('click', () => close());
$('close').addEventListener('click', e => { e.stopPropagation(); close(); });
addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
addEventListener('popstate', () => { const id = location.hash.slice(1); if (id && ARTICLES.some(a => a.id === id)) open(id, null, false); else close(true); });
if (location.hash.length > 1) open(location.hash.slice(1), null, false);

/* смахнуть шторку вниз */
let dragY = null, dragT = 0, dragD = 0;
function startDrag(e){ if (innerWidth >= 700) return; dragY = e.clientY; dragT = performance.now(); dragD = 0; sheet.classList.add('drag'); }
grab.addEventListener('pointerdown', e => { if (e.target.closest('.close')) return; grab.setPointerCapture(e.pointerId); startDrag(e); });
grab.addEventListener('pointermove', e => { if (dragY === null) return; dragD = Math.max(0, e.clientY - dragY); sheet.style.setProperty('--dy', dragD + 'px'); });
const endDrag = () => { if (dragY === null) return; const v = dragD / Math.max(1, performance.now() - dragT);
  dragY = null; sheet.classList.remove('drag');
  if (dragD > 110 || v > .6) close(); else sheet.style.removeProperty('--dy'); };
grab.addEventListener('pointerup', endDrag); grab.addEventListener('pointercancel', endDrag);
/* и когда открытка прокручена до верха — тоже можно тянуть вниз за неё */
let ts = null;
sheet.addEventListener('touchstart', e => { if (sheet.scrollTop <= 0 && !e.target.closest('.grab')) { ts = e.touches[0].clientY; dragT = performance.now(); dragD = 0; } else ts = null; }, {passive:true});
sheet.addEventListener('touchmove', e => { if (ts === null) return; const d = e.touches[0].clientY - ts;
  if (d > 0 && sheet.scrollTop <= 0) { e.preventDefault(); dragY = ts; dragD = d; sheet.classList.add('drag'); sheet.style.setProperty('--dy', d + 'px'); } }, {passive:false});
sheet.addEventListener('touchend', () => { if (ts !== null && dragY !== null) endDrag(); ts = null; });

/* ---------- наклон: телефон в руке, мышь или палец ---------- */
let tx = 0, ty = 0, cx = 0, cy = 0, raf = 0, b0 = null, g0 = null, gyro = false;
function setTarget(x, y){ tx = Math.max(-1, Math.min(1, x)); ty = Math.max(-1, Math.min(1, y)); if (!raf && !RM) raf = requestAnimationFrame(step); }
function step(){
  cx += (tx - cx) * .12; cy += (ty - cy) * .12;
  /* открытка стоит, двигается только картинка внутри — как за стеклом */
  card.style.setProperty('--ry', (cx * 6).toFixed(2) + 'deg');
  card.style.setProperty('--rx', (-cy * 5).toFixed(2) + 'deg');
  card.style.setProperty('--px', (-cx * 18).toFixed(1) + 'px');
  card.style.setProperty('--py', (-cy * 13).toFixed(1) + 'px');
  card.style.setProperty('--gx', (45 + cx * 30).toFixed(1) + '%');
  raf = (Math.abs(tx - cx) + Math.abs(ty - cy) > .002) ? requestAnimationFrame(step) : 0;
}
function resetTilt(){ b0 = g0 = null; if (!gyro) setTarget(0, 0); }
card.addEventListener('pointermove', e => {
  if (gyro && e.pointerType !== 'mouse') return;
  const r = card.getBoundingClientRect();
  setTarget(((e.clientX - r.left) / r.width - .5) * 2, ((e.clientY - r.top) / r.height - .5) * 2);
});
card.addEventListener('pointerleave', () => { if (!gyro) setTarget(0, 0); });

function onOrient(e){
  if (e.beta == null || e.gamma == null) return;
  gyro = true;
  if (!openId) return;
  if (b0 === null) { b0 = e.beta; g0 = e.gamma; }
  /* «ноль» медленно подстраивается под то, как человек держит телефон */
  b0 += (e.beta - b0) * .01; g0 += (e.gamma - g0) * .01;
  setTarget((e.gamma - g0) / 18, (e.beta - b0) / 18);
}
let asked = false;
function askMotion(){
  if (asked || RM) return; asked = true;
  const D = window.DeviceOrientationEvent;
  if (!D) return;
  if (typeof D.requestPermission === 'function') {
    D.requestPermission().catch(() => {});
  }
}
/* слушаем сразу: на Android события идут без вопросов, на iPhone — после разрешения */
if (!RM && window.DeviceOrientationEvent) addEventListener('deviceorientation', onOrient);
})();
</script>
